<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil do Corretor de Imóveis</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>

    <div class="container">
        <header>
            <h1>Perfil do Corretor</h1>
            <p>Vamos construir sua estratégia digital personalizada.</p>
        </header>

        <form id="corretorForm">
            <!-- 1. Nome -->
            <div class="form-group slide-in">
                <label for="nome">1. Qual seu nome?</label>
                <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required>
            </div>

            <!-- 2. Perfil Pessoal -->
            <div class="form-group slide-in">
                <label>2. Você se considera mais:</label>
                <div class="options-grid">
                    <label class="option-card">
                        <input type="radio" name="perfil" value="Técnico e analítico" required>
                        <span class="option-content">Técnico e analítico</span>
                    </label>
                    <label class="option-card">
                        <input type="radio" name="perfil" value="Comunicativo e expansivo">
                        <span class="option-content">Comunicativo e expansivo</span>
                    </label>
                    <label class="option-card">
                        <input type="radio" name="perfil" value="Estratégico e discreto">
                        <span class="option-content">Estratégico e discreto</span>
                    </label>
                    <label class="option-card">
                        <input type="radio" name="perfil" value="Inspirador e emocional">
                        <span class="option-content">Inspirador e emocional</span>
                    </label>
                </div>
            </div>

            <!-- 3. Preferência de Trabalho -->
            <div class="form-group slide-in">
                <label>3. Você gosta mais de:</label>
                <div class="options-grid">
                    <label class="option-card">
                        <input type="radio" name="preferencia" value="Negociar" required>
                        <span class="option-content">Negociar</span>
                    </label>
                    <label class="option-card">
                        <input type="radio" name="preferencia" value="Atender e ouvir">
                        <span class="option-content">Atender e ouvir</span>
                    </label>
                    <label class="option-card">
                        <input type="radio" name="preferencia" value="Prospectar">
                        <span class="option-content">Prospectar</span>
                    </label>
                    <label class="option-card">
                        <input type="radio" name="preferencia" value="Explicar detalhes técnicos">
                        <span class="option-content">Explicar detalhes técnicos</span>
                    </label>
                </div>
            </div>

            <!-- 4. Aparição -->
            <div class="form-group slide-in">
                <label>4. Você prefere aparecer:</label>
                <div class="options-grid">
                    <label class="option-card">
                        <input type="radio" name="aparicao" value="Falando direto para a câmera" required>
                        <span class="option-content">Falando direto para a câmera</span>
                    </label>
                    <label class="option-card">
                        <input type="radio" name="aparicao" value="Mostrando imóveis">
                        <span class="option-content">Mostrando imóveis</span>
                    </label>
                    <label class="option-card">
                        <input type="radio" name="aparicao" value="Em bastidores">
                        <span class="option-content">Em bastidores</span>
                    </label>
                    <label class="option-card">
                        <input type="radio" name="aparicao" value="Em fotos mais institucionais">
                        <span class="option-content">Em fotos mais institucionais</span>
                    </label>
                </div>
            </div>

            <!-- 5. Diferencial -->
            <div class="form-group slide-in">
                <label for="diferencial">5. Seu diferencial como corretor é:</label>
                <textarea id="diferencial" name="diferencial" placeholder="Descreva seu diferencial..." required></textarea>
            </div>

            <!-- 6. Inspiração -->
            <div class="form-group slide-in">
                <label for="inspiracao">6. Qual corretor ou criador de conteúdo do mercado imobiliário você mais se inspira no Instagram?</label>
                <input type="text" id="inspiracao" name="inspiracao" placeholder="Nome do perfil ou corretor" required>
            </div>

            <!-- 7. Admiração (Multipla Escolha) -->
            <div class="form-group slide-in">
                <label>7. O que você mais admira nesse perfil? (Pode marcar mais de uma)</label>
                <div class="options-grid">
                    <label class="option-card">
                        <input type="checkbox" name="admiracao" value="Autoridade">
                        <span class="option-content">Autoridade</span>
                    </label>
                    <label class="option-card">
                        <input type="checkbox" name="admiracao" value="Estética visual">
                        <span class="option-content">Estética visual</span>
                    </label>
                    <label class="option-card">
                        <input type="checkbox" name="admiracao" value="Forma de falar">
                        <span class="option-content">Forma de falar</span>
                    </label>
                    <label class="option-card">
                        <input type="checkbox" name="admiracao" value="Estratégia de vendas">
                        <span class="option-content">Estratégia de vendas</span>
                    </label>
                    <label class="option-card">
                        <input type="checkbox" name="admiracao" value="Frequência de postagem">
                        <span class="option-content">Frequência de postagem</span>
                    </label>
                    <label class="option-card">
                        <input type="checkbox" name="admiracao" value="Clareza nas explicações">
                        <span class="option-content">Clareza nas explicações</span>
                    </label>
                </div>
            </div>

            <!-- 8. Tipo de Imóvel -->
            <div class="form-group slide-in">
                <label>8. Qual tipo de imóvel você quer vender com mais frequência?</label>
                <div class="options-grid">
                    <label class="option-card">
                        <input type="radio" name="tipo_imovel" value="Popular / Minha Casa Minha Vida" required>
                        <span class="option-content">Popular / MCMV</span>
                    </label>
                    <label class="option-card">
                        <input type="radio" name="tipo_imovel" value="Médio padrão">
                        <span class="option-content">Médio padrão</span>
                    </label>
                    <label class="option-card">
                        <input type="radio" name="tipo_imovel" value="Alto padrão">
                        <span class="option-content">Alto padrão</span>
                    </label>
                    <label class="option-card">
                        <input type="radio" name="tipo_imovel" value="Lotes / terrenos">
                        <span class="option-content">Lotes / terrenos</span>
                    </label>
                    <label class="option-card">
                        <input type="radio" name="tipo_imovel" value="Comercial">
                        <span class="option-content">Comercial</span>
                    </label>
                </div>
            </div>

            <!-- 9. Público Principal -->
            <div class="form-group slide-in">
                <label>9. Seu público principal é:</label>
                <div class="options-grid">
                    <label class="option-card">
                        <input type="radio" name="publico" value="Primeira compra" required>
                        <span class="option-content">Primeira compra</span>
                    </label>
                    <label class="option-card">
                        <input type="radio" name="publico" value="Investidores">
                        <span class="option-content">Investidores</span>
                    </label>
                    <label class="option-card">
                        <input type="radio" name="publico" value="Famílias">
                        <span class="option-content">Famílias</span>
                    </label>
                    <label class="option-card">
                        <input type="radio" name="publico" value="Empresários">
                        <span class="option-content">Empresários</span>
                    </label>
                    <label class="option-card">
                        <input type="radio" name="publico" value="Pessoas que querem sair do aluguel">
                        <span class="option-content">Sair do aluguel</span>
                    </label>
                </div>
            </div>

            <!-- 10. Imagem Desejada -->
            <div class="form-group slide-in">
                <label>10. Você quer ser visto como:</label>
                <div class="options-grid">
                    <label class="option-card">
                        <input type="radio" name="imagem" value="Especialista técnico" required>
                        <span class="option-content">Especialista técnico</span>
                    </label>
                    <label class="option-card">
                        <input type="radio" name="imagem" value="Corretor de confiança">
                        <span class="option-content">Corretor de confiança</span>
                    </label>
                    <label class="option-card">
                        <input type="radio" name="imagem" value="Amigo/conselheiro">
                        <span class="option-content">Amigo/conselheiro</span>
                    </label>
                    <label class="option-card">
                        <input type="radio" name="imagem" value="Autoridade no mercado">
                        <span class="option-content">Autoridade no mercado</span>
                    </label>
                     <label class="option-card">
                        <input type="radio" name="imagem" value="Corretor de luxo">
                        <span class="option-content">Corretor de luxo</span>
                    </label>
                </div>
            </div>

            <!-- 11. Estilo de Perfil -->
            <div class="form-group slide-in">
                <label>11. Você prefere um perfil que seja:</label>
                <div class="options-grid">
                    <label class="option-card">
                        <input type="radio" name="estilo_perfil" value="Mais institucional" required>
                        <span class="option-content">Mais institucional</span>
                    </label>
                    <label class="option-card">
                        <input type="radio" name="estilo_perfil" value="Mais pessoal">
                        <span class="option-content">Mais pessoal</span>
                    </label>
                    <label class="option-card">
                        <input type="radio" name="estilo_perfil" value="Meio termo entre pessoal e profissional">
                        <span class="option-content">Meio termo</span>
                    </label>
                </div>
            </div>

            <!-- 12. Conteúdo Preferido -->
            <div class="form-group slide-in">
                <label>12. Você prefere um conteúdo:</label>
                <div class="options-grid">
                    <label class="option-card">
                        <input type="radio" name="conteudo" value="Educativo" required>
                        <span class="option-content">Educativo</span>
                    </label>
                    <label class="option-card">
                        <input type="radio" name="conteudo" value="Motivacional">
                        <span class="option-content">Motivacional</span>
                    </label>
                    <label class="option-card">
                        <input type="radio" name="conteudo" value="Direto para venda">
                        <span class="option-content">Direto para venda</span>
                    </label>
                    <label class="option-card">
                        <input type="radio" name="conteudo" value="Bastidores do dia a dia">
                        <span class="option-content">Bastidores</span>
                    </label>
                     <label class="option-card">
                        <input type="radio" name="conteudo" value="Lifestyle">
                        <span class="option-content">Lifestyle</span>
                    </label>
                </div>
            </div>

            <!-- 13. Estado do Instagram -->
            <div class="form-group slide-in">
                <label>13. Seu Instagram hoje está mais:</label>
                <div class="options-grid">
                    <label class="option-card">
                        <input type="radio" name="instagram_estado" value="Parado" required>
                        <span class="option-content">Parado</span>
                    </label>
                    <label class="option-card">
                        <input type="radio" name="instagram_estado" value="Muito vendedor">
                        <span class="option-content">Muito vendedor</span>
                    </label>
                    <label class="option-card">
                        <input type="radio" name="instagram_estado" value="Confuso">
                        <span class="option-content">Confuso</span>
                    </label>
                    <label class="option-card">
                        <input type="radio" name="instagram_estado" value="Sem posicionamento">
                        <span class="option-content">Sem posicionamento</span>
                    </label>
                </div>
            </div>

            <!-- 14. Meta Instagram -->
            <div class="form-group slide-in">
                <label>14. Sua meta principal com o Instagram é:</label>
                <div class="options-grid">
                    <label class="option-card">
                        <input type="radio" name="meta_instagram" value="Gerar leads" required>
                        <span class="option-content">Gerar leads</span>
                    </label>
                    <label class="option-card">
                        <input type="radio" name="meta_instagram" value="Vender direto">
                        <span class="option-content">Vender direto</span>
                    </label>
                    <label class="option-card">
                        <input type="radio" name="meta_instagram" value="Construir autoridade">
                        <span class="option-content">Construir autoridade</span>
                    </label>
                    <label class="option-card">
                        <input type="radio" name="meta_instagram" value="Fortalecer marca pessoal">
                        <span class="option-content">Fortalecer marca pessoal</span>
                    </label>
                </div>
            </div>

            <!-- 15. Tipos de Conteúdo (Multipla Escolha) -->
            <div class="form-group slide-in">
                <label>15. Quais tipos de conteúdos você quer postar com mais frequência? (Pode marcar mais de uma)</label>
                <div class="options-grid">
                    <label class="option-card">
                        <input type="checkbox" name="tipos_conteudo" value="Apresentação de imóveis">
                        <span class="option-content">Apresentação de imóveis</span>
                    </label>
                    <label class="option-card">
                        <input type="checkbox" name="tipos_conteudo" value="Conteúdo educativo sobre mercado">
                        <span class="option-content">Conteúdo educativo</span>
                    </label>
                    <label class="option-card">
                        <input type="checkbox" name="tipos_conteudo" value="Conteúdo motivacional">
                        <span class="option-content">Conteúdo motivacional</span>
                    </label>
                    <label class="option-card">
                        <input type="checkbox" name="tipos_conteudo" value="Bastidores do dia a dia">
                        <span class="option-content">Bastidores do dia a dia</span>
                    </label>
                    <label class="option-card">
                        <input type="checkbox" name="tipos_conteudo" value="Lifestyle (rotina, conquistas, viagens)">
                        <span class="option-content">Lifestyle</span>
                    </label>
                    <label class="option-card">
                        <input type="checkbox" name="tipos_conteudo" value="Conteúdo direto de venda">
                        <span class="option-content">Conteúdo de venda</span>
                    </label>
                    <label class="option-card">
                        <input type="checkbox" name="tipos_conteudo" value="Conteúdo estratégico para investidores">
                        <span class="option-content">Para investidores</span>
                    </label>
                </div>
            </div>

            <!-- 16. Frequência de Gravação -->
            <div class="form-group slide-in">
                <label>16. Está disposto a gravar quantas vezes por semana?</label>
                <div class="options-grid">
                    <label class="option-card">
                        <input type="radio" name="frequencia_gravacao" value="1" required>
                        <span class="option-content">1</span>
                    </label>
                    <label class="option-card">
                        <input type="radio" name="frequencia_gravacao" value="2–3">
                        <span class="option-content">2 – 3</span>
                    </label>
                    <label class="option-card">
                        <input type="radio" name="frequencia_gravacao" value="4 ou mais">
                        <span class="option-content">4 ou mais</span>
                    </label>
                </div>
            </div>

            <!-- 17. Stories -->
            <div class="form-group slide-in">
                <label>17. Você está disposto a aparecer nos stories todos os dias?</label>
                <div class="options-grid">
                    <label class="option-card">
                        <input type="radio" name="stories_diarios" value="Sim" required>
                        <span class="option-content">Sim</span>
                    </label>
                    <label class="option-card">
                        <input type="radio" name="stories_diarios" value="Apenas dias estratégicos">
                        <span class="option-content">Apenas dias estratégicos</span>
                    </label>
                    <label class="option-card">
                        <input type="radio" name="stories_diarios" value="Prefiro menos exposição">
                        <span class="option-content">Prefiro menos exposição</span>
                    </label>
                </div>
            </div>

            <!-- 18. Uso dos Stories (Multipla Escolha) -->
            <div class="form-group slide-in">
                <label>18. Você quer usar mais nos stories: (Pode marcar mais de uma)</label>
                <div class="options-grid">
                    <label class="option-card">
                        <input type="checkbox" name="uso_stories" value="Prova social (clientes, vendas)">
                        <span class="option-content">Prova social</span>
                    </label>
                    <label class="option-card">
                        <input type="checkbox" name="uso_stories" value="Enquetes e interação">
                        <span class="option-content">Enquetes e interação</span>
                    </label>
                    <label class="option-card">
                        <input type="checkbox" name="uso_stories" value="Explicações técnicas">
                        <span class="option-content">Explicações técnicas</span>
                    </label>
                    <label class="option-card">
                        <input type="checkbox" name="uso_stories" value="Mostruário de imóveis">
                        <span class="option-content">Mostruário de imóveis</span>
                    </label>
                    <label class="option-card">
                        <input type="checkbox" name="uso_stories" value="Vida pessoal">
                        <span class="option-content">Vida pessoal</span>
                    </label>
                </div>
            </div>

            <!-- 19. Três Valores -->
            <div class="form-group slide-in">
                <label for="valores">19. Três valores que você quer transmitir:</label>
                <textarea id="valores" name="valores" placeholder="Ex: Ética, Agilidade, Exclusividade" required></textarea>
            </div>

            <!-- 20. Reconhecimento -->
            <div class="form-group slide-in">
                <label>20. Você quer ser reconhecido no Instagram como:</label>
                <div class="options-grid">
                    <label class="option-card">
                        <input type="radio" name="reconhecimento" value="Especialista em um nicho específico" required>
                        <span class="option-content">Especialista em nicho</span>
                    </label>
                    <label class="option-card">
                        <input type="radio" name="reconhecimento" value="Corretor referência da cidade">
                        <span class="option-content">Referência da cidade</span>
                    </label>
                    <label class="option-card">
                        <input type="radio" name="reconhecimento" value="Corretor de alto padrão">
                        <span class="option-content">Corretor de alto padrão</span>
                    </label>
                    <label class="option-card">
                        <input type="radio" name="reconhecimento" value="Corretor popular de volume">
                        <span class="option-content">Corretor popular</span>
                    </label>
                    <label class="option-card">
                        <input type="radio" name="reconhecimento" value="Autoridade em investimentos">
                        <span class="option-content">Autoridade em investimentos</span>
                    </label>
                </div>
            </div>

            <!-- 21. Transmissão do Perfil -->
            <div class="form-group slide-in">
                <label>21. Você quer que seu perfil transmita mais:</label>
                <div class="options-grid">
                    <label class="option-card">
                        <input type="radio" name="transmissao" value="Formalidade" required>
                        <span class="option-content">Formalidade</span>
                    </label>
                    <label class="option-card">
                        <input type="radio" name="transmissao" value="Modernidade">
                        <span class="option-content">Modernidade</span>
                    </label>
                    <label class="option-card">
                        <input type="radio" name="transmissao" value="Sofisticação">
                        <span class="option-content">Sofisticação</span>
                    </label>
                    <label class="option-card">
                        <input type="radio" name="transmissao" value="Popularidade">
                        <span class="option-content">Popularidade</span>
                    </label>
                    <label class="option-card">
                        <input type="radio" name="transmissao" value="Exclusividade">
                        <span class="option-content">Exclusividade</span>
                    </label>
                </div>
            </div>

            <!-- 22. O que NÃO parecer -->
            <div class="form-group slide-in">
                <label for="nao_parecer">22. O que você NÃO quer que seu Instagram pareça?</label>
                <textarea id="nao_parecer" name="nao_parecer" placeholder="Descreva o que evitar..." required></textarea>
            </div>

            <!-- 23. Sensação -->
            <div class="form-group slide-in">
                <label for="sensacao">23. Se alguém entrar no seu perfil hoje, qual sensação você quer que ele tenha?</label>
                <textarea id="sensacao" name="sensacao" placeholder="Descreva a sensação..." required></textarea>
            </div>

            <button type="submit" id="submitBtn">Enviar Respostas</button>
        </form>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="toast hidden"></div>

    <script src="script.js"></script>
</body>
</html>
